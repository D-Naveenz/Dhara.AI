      <stop offset="0" stop-color="#06457d"/>
      <stop offset="0.48" stop-color="#0877a1"/>
      <stop offset="1" stop-color="#36c9c2"/>
    </linearGradient>
    <linearGradient id="dhara-leaf" x1="98" y1="120" x2="130" y2="62" gradientUnits="userSpaceOnUse">
