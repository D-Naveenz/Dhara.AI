      <feGaussianBlur in="offset" stdDeviation="0.45" result="blur"/>
      <feFlood flood-color="#002d55" flood-opacity="0.11" result="shadow-color"/>
      <feComposite in="shadow-color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
